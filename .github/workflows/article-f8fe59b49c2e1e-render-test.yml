name: render 0001 canonical views test

on:
  push:
    paths:
      - "workspace/articles/f8fe59b49c2e1e/docs/99_work/e2e_pilot/render_test_trigger.txt"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/articles/f8fe59b49c2e1e
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Render canonical JSON to Markdown
        shell: bash
        run: |
          set -euo pipefail
          sha256sum docs/10_each_lore/0001_kuchisake_onna/0001_00_sources.json docs/10_each_lore/0001_kuchisake_onna/0001_10_contents.json docs/10_each_lore/0001_kuchisake_onna/0001_20_analysis.json > /tmp/before.sha
          python -m src.rendering.render_00_sources 0001
          python -m src.rendering.render_10_contents 0001
          python -m src.rendering.render_20_analysis 0001
          sha256sum docs/10_each_lore/0001_kuchisake_onna/0001_00_sources.json docs/10_each_lore/0001_kuchisake_onna/0001_10_contents.json docs/10_each_lore/0001_kuchisake_onna/0001_20_analysis.json > /tmp/after.sha
          diff -u /tmp/before.sha /tmp/after.sha
          echo "=== GENERATED FILE STATS ==="
          wc -l docs/99_work/rendered_10_each_lore/0001/0001_00_sources.md docs/99_work/rendered_10_each_lore/0001/0001_10_contents.md docs/99_work/rendered_10_each_lore/0001/0001_20_analysis.md
          echo "=== 00 ==="
          cat docs/99_work/rendered_10_each_lore/0001/0001_00_sources.md
          echo "=== 10 ==="
          cat docs/99_work/rendered_10_each_lore/0001/0001_10_contents.md
          echo "=== 20 ==="
          cat docs/99_work/rendered_10_each_lore/0001/0001_20_analysis.md
