name: f8fe59b49c2e1e fixture tests

on:
  push:
    paths:
      - ".github/workflows/article-f8fe59b49c2e1e-tests.yml"
      - "workspace/articles/f8fe59b49c2e1e/src/**"
      - "workspace/articles/f8fe59b49c2e1e/tests/**"
      - "workspace/articles/f8fe59b49c2e1e/docs/10_each_lore/0000_tutorial/schemas/**"
      - "workspace/articles/f8fe59b49c2e1e/docs/10_each_lore/*/*.json"
      - "workspace/articles/f8fe59b49c2e1e/docs/10_each_lore/*/*.json"
      - "workspace/articles/f8fe59b49c2e1e/docs/00_research_overview/taxonomy_catalog.json"
  pull_request:
    paths:
      - "workspace/articles/f8fe59b49c2e1e/src/**"
      - "workspace/articles/f8fe59b49c2e1e/tests/**"
      - "workspace/articles/f8fe59b49c2e1e/docs/10_each_lore/0000_tutorial/schemas/**"
      - "workspace/articles/f8fe59b49c2e1e/docs/00_research_overview/taxonomy_catalog.json"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/articles/f8fe59b49c2e1e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install fixture-test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.0.3 jsonschema==4.25.1
      - name: Run fixture suite
        run: python -m pytest -q tests
      - name: Validate E2E pilot stages present in repository
        shell: bash
        run: |
          set -euo pipefail
          if test -f docs/10_each_lore/0001_kuchisake_onna/0001_00_sources.json; then
            python -m src.validation.validate_entry 0001 --through 00
          fi
          if test -f docs/10_each_lore/0001_kuchisake_onna/0001_10_contents.json; then
            python -m src.validation.validate_entry 0001 --through 10
          fi
          if test -f docs/10_each_lore/0001_kuchisake_onna/0001_20_analysis.json; then
            python -m src.validation.validate_entry 0001 --through 20
          fi
