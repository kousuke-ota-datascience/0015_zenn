name: f8fe59b49c2e1e fixture tests

on:
  push:
    paths:
      - ".github/workflows/article-f8fe59b49c2e1e-tests.yml"
      - "workspace/articles/f8fe59b49c2e1e/src/**"
      - "workspace/articles/f8fe59b49c2e1e/tests/**"
      - "workspace/articles/f8fe59b49c2e1e/docs/10_each_lore/0000_tutorial/schemas/**"
      - "workspace/articles/f8fe59b49c2e1e/docs/00_research_overview/taxonomy_catalog.json"
  pull_request:
    paths:
      - "workspace/articles/f8fe59b49c2e1e/src/**"
      - "workspace/articles/f8fe59b49c2e1e/tests/**"
      - "workspace/articles/f8fe59b49c2e1e/docs/10_each_lore/0000_tutorial/schemas/**"
      - "workspace/articles/f8fe59b49c2e1e/docs/00_research_overview/taxonomy_catalog.json"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/articles/f8fe59b49c2e1e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install fixture-test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.0.3 jsonschema==4.25.1
      - name: Run fixture suite
        run: python -m pytest -q tests
