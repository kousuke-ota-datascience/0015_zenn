name: f8fe59b49c2e1e fixture tests

on:
  push:
    paths:
      - ".github/workflows/article-f8fe59b49c2e1e-tests.yml"
      - "workspace/articles/f8fe59b49c2e1e/src/**"
      - "workspace/articles/f8fe59b49c2e1e/tests/**"
      - "workspace/articles/f8fe59b49c2e1e/docs/10_each_lore/0000_tutorial/schemas/**"
      - "workspace/articles/f8fe59b49c2e1e/docs/10_each_lore/*/*.json"
      - "workspace/articles/f8fe59b49c2e1e/reviews/10_each_lore/**/*.json"
      - "workspace/articles/f8fe59b49c2e1e/docs/00_research_overview/taxonomy_catalog.json"
  pull_request:
    paths:
      - "workspace/articles/f8fe59b49c2e1e/src/**"
      - "workspace/articles/f8fe59b49c2e1e/tests/**"
      - "workspace/articles/f8fe59b49c2e1e/docs/10_each_lore/0000_tutorial/schemas/**"
      - "workspace/articles/f8fe59b49c2e1e/docs/10_each_lore/*/*.json"
      - "workspace/articles/f8fe59b49c2e1e/reviews/10_each_lore/**/*.json"
      - "workspace/articles/f8fe59b49c2e1e/docs/00_research_overview/taxonomy_catalog.json"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/articles/f8fe59b49c2e1e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install fixture-test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.0.3 jsonschema==4.25.1
      - name: Run fixture suite
        run: python -m pytest -q tests
      - name: Validate E2E regression entries present in repository
        shell: bash
        run: |
          set -euo pipefail
          for entry in 0001 0180; do
            if find docs/10_each_lore -mindepth 2 -maxdepth 2 -name "${entry}_00_sources.json" -print -quit | grep -q .; then
              python -m src.validation.validate_entry "$entry" --through 00
            fi
            if find docs/10_each_lore -mindepth 2 -maxdepth 2 -name "${entry}_10_contents.json" -print -quit | grep -q .; then
              python -m src.validation.validate_entry "$entry" --through 10
            fi
            if find docs/10_each_lore -mindepth 2 -maxdepth 2 -name "${entry}_20_analysis.json" -print -quit | grep -q .; then
              python -m src.validation.validate_entry "$entry" --through 20
            fi
          done
      - name: Validate E2E regression Review history
        run: |
          python - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          from src.status_management.review_state import load_entry_review_state

          minimum_latest = {"0001": 3, "0180": 1}
          for entry_id, minimum in minimum_latest.items():
              review_dir = Path("reviews/10_each_lore") / entry_id
              if not review_dir.is_dir() or not any(review_dir.glob("Review_*.json")):
                  print({"entry_id": entry_id, "review_cycles": [], "status": "not-yet-reviewed"})
                  continue

              snapshot = load_entry_review_state(entry_id)
              if snapshot.issues:
                  raise SystemExit(f"{entry_id} Review history issues: {snapshot.issues}")
              by_seq = defaultdict(set)
              for fact in snapshot.all_reviews:
                  by_seq[fact.review_seq].add(fact.artifact)
              expected = {"00", "10", "20"}
              incomplete = {seq: arts for seq, arts in by_seq.items() if arts != expected}
              if incomplete:
                  raise SystemExit(f"{entry_id} incomplete Review cycles: {incomplete}")
              if max(by_seq) < minimum:
                  raise SystemExit(
                      f"{entry_id} expected Review Seq >= {minimum}, got {sorted(by_seq)}"
                  )
              print({
                  "entry_id": entry_id,
                  "review_cycles": sorted(by_seq),
                  "latest": {k: v.review_seq for k, v in snapshot.latest.items()},
              })
          PY
