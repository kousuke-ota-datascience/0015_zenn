name: publish rendered coverage-contract views

on:
  push:
    paths:
      - "workspace/articles/f8fe59b49c2e1e/docs/99_work/e2e_pilot/publish_coverage_render_trigger.txt"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/articles/f8fe59b49c2e1e
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Render regression entries
        run: |
          set -euo pipefail
          for entry in 0001 0178 0179 0180; do
            python -m src.rendering.render_00_sources "$entry"
            python -m src.rendering.render_10_contents "$entry"
            python -m src.rendering.render_20_analysis "$entry"
          done
      - name: Commit rendered Markdown
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/99_work/rendered_10_each_lore/0001/
          git add docs/99_work/rendered_10_each_lore/0178/
          git add docs/99_work/rendered_10_each_lore/0179/
          git add docs/99_work/rendered_10_each_lore/0180/
          git commit -m "Refresh rendered Markdown for summary coverage contract"
          git push
