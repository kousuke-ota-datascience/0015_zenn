name: blind E2E semantic review

on:
  push:
    branches:
      - blind-e2e-20260918-4entries
    paths:
      - "workspace/articles/f8fe59b49c2e1e/docs/99_work/e2e_pilot/blind_e2e_review_trigger.txt"

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/articles/f8fe59b49c2e1e
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Write blind Review cycles
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from src.reviewing.review_writer import prepare_review_cycle, write_review_cycle

          bodies = json.loads(
              Path("docs/99_work/e2e_pilot/blind_e2e_review_bodies.tmp.json").read_text(encoding="utf-8")
          )
          expected_seq = {"0001": 5, "0178": 3, "0179": 3, "0180": 3}
          for entry_id in ("0001", "0178", "0179", "0180"):
              cycle = prepare_review_cycle(entry_id)
              result = write_review_cycle(entry_id, cycle=cycle, reviews=bodies[entry_id])
              print(json.dumps(result, ensure_ascii=False, indent=2))
              assert result["review_seq"] == expected_seq[entry_id], result
              assert result["verdicts"] == {"00": "Pass", "10": "Pass", "20": "Pass"}, result
          PY
      - name: Commit blind Review JSON
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews/10_each_lore/0001/Review_0001_*_005.json
          git add reviews/10_each_lore/0178/Review_0178_*_003.json
          git add reviews/10_each_lore/0179/Review_0179_*_003.json
          git add reviews/10_each_lore/0180/Review_0180_*_003.json
          git commit -m "Add blind E2E Review cycles"
          git push
