name: write 0178 0179 Review cycle 1

on:
  push:
    paths:
      - "workspace/articles/f8fe59b49c2e1e/docs/99_work/e2e_pilot/summary_review_trigger.txt"

permissions:
  contents: write

jobs:
  write-reviews:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/articles/f8fe59b49c2e1e
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Write Review cycles
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from src.reviewing.review_writer import prepare_review_cycle, write_review_cycle

          for entry_id in ("0178", "0179"):
              body = Path(f"docs/99_work/e2e_pilot/{entry_id}_review_cycle_001_bodies.tmp.json")
              reviews = json.loads(body.read_text(encoding="utf-8"))
              cycle = prepare_review_cycle(entry_id)
              result = write_review_cycle(entry_id, cycle=cycle, reviews=reviews)
              print(json.dumps(result, ensure_ascii=False, indent=2))
              assert result["review_seq"] == 1, result
              assert result["verdicts"] == {"00": "Pass", "10": "Pass", "20": "Pass"}, result
          PY
      - name: Commit Review JSON
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews/10_each_lore/0178/Review_0178_00_001.json
          git add reviews/10_each_lore/0178/Review_0178_10_001.json
          git add reviews/10_each_lore/0178/Review_0178_20_001.json
          git add reviews/10_each_lore/0179/Review_0179_00_001.json
          git add reviews/10_each_lore/0179/Review_0179_10_001.json
          git add reviews/10_each_lore/0179/Review_0179_20_001.json
          git commit -m "Add canonical 0178 and 0179 Review cycle 001"
          git push
