name: 0001 legacy semantic render regression

on:
  push:
    paths:
      - "workspace/articles/f8fe59b49c2e1e/docs/99_work/e2e_pilot/render_regression_trigger.txt"

permissions:
  contents: read

jobs:
  render-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/articles/f8fe59b49c2e1e
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Render and verify restored legacy semantics
        shell: bash
        run: |
          set -euo pipefail
          sha256sum docs/10_each_lore/0001_kuchisake_onna/0001_00_sources.json docs/10_each_lore/0001_kuchisake_onna/0001_10_contents.json > /tmp/before.sha
          python -m src.rendering.render_00_sources 0001
          python -m src.rendering.render_10_contents 0001
          sha256sum docs/10_each_lore/0001_kuchisake_onna/0001_00_sources.json docs/10_each_lore/0001_kuchisake_onna/0001_10_contents.json > /tmp/after.sha
          diff -u /tmp/before.sha /tmp/after.sha

          out00=docs/99_work/rendered_10_each_lore/0001/0001_00_sources.md
          out10=docs/99_work/rendered_10_each_lore/0001/0001_10_contents.md

          grep -F "月刊教育の森" "$out00"
          grep -F "請求記号 YB-255" "$out00"
          grep -F "美濃加茂市・八百津町・岐阜市" "$out00"
          grep -F "国立民族学博物館" "$out00"
          grep -F "本文を直接精査していない" "$out00"

          grep -F "美濃加茂市・八百津町・岐阜市" "$out10"
          grep -F "パトロールや集団下校" "$out10"
          grep -F "各媒体が噂の拡散をどの程度因果的に加速したか" "$out10"
          grep -F "由来説明" "$out10"
          grep -F "最初期共有核へ一括遡及しない" "$out10"
          grep -F "1979年9月" "$out10"

          echo "LEGACY_SEMANTIC_RENDER=PASS"
