name: execute sync_controlplane 0001

on:
  push:
    paths:
      - "workspace/articles/f8fe59b49c2e1e/docs/99_work/e2e_pilot/sync_exec_trigger.txt"

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/articles/f8fe59b49c2e1e
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Execute requested command
        run: python -m src.status_management.sync_controlplane 0001
