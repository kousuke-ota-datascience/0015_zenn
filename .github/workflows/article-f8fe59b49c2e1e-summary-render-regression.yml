name: 0178 0179 summary render regression

on:
  push:
    paths:
      - "workspace/articles/f8fe59b49c2e1e/docs/99_work/e2e_pilot/summary_render_trigger.txt"

permissions:
  contents: read

jobs:
  summary-render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/articles/f8fe59b49c2e1e
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Render and verify summary narrative only
        run: |
          set -euo pipefail
          sha256sum docs/10_each_lore/0178_saruyume/0178_10_contents.json docs/10_each_lore/0179_kunekune/0179_10_contents.json > /tmp/before.sha

          python -m src.rendering.render_10_contents 0178
          python -m src.rendering.render_10_contents 0179

          sha256sum docs/10_each_lore/0178_saruyume/0178_10_contents.json docs/10_each_lore/0179_kunekune/0179_10_contents.json > /tmp/after.sha
          diff -u /tmp/before.sha /tmp/after.sha

          python - <<'PY'
          from pathlib import Path

          root = Path("docs/99_work/rendered_10_each_lore")
          expected = {
              "0178": [
                  "薄暗い無人駅",
                  "お猿さん電車",
                  "順番",
                  "覚醒",
                  "4年後",
                  "前回の続き",
                  "再び覚醒",
                  "次回は逃がさない",
                  "猿夢＋",
                  "後代派生",
                  "絶対的初出",
              ],
              "0179": [
                  "白い人影",
                  "詳しく見",
                  "分からないほうがいい",
                  "重大な精神・行動上の異変",
                  "混ぜて詳しく書いた",
                  "秋田",
                  "田園",
                  "双眼鏡",
                  "祖父",
                  "見てはならない",
                  "2003年増補",
                  "2001年型へ遡及しない",
                  "読者が記事を理解しただけで作用する型",
              ],
          }

          for entry_id, anchors in expected.items():
              path = root / entry_id / f"{entry_id}_10_contents.md"
              text = path.read_text(encoding="utf-8")
              start = text.index("## Summary") + len("## Summary")
              end = text.index("### Structure", start)
              narrative = text[start:end]
              missing = [anchor for anchor in anchors if anchor not in narrative]
              if missing:
                  raise SystemExit(f"{entry_id} rendered summary lost semantics: {missing}")
              print({"entry_id": entry_id, "summary_anchors": len(anchors), "result": "PASS"})
          PY
