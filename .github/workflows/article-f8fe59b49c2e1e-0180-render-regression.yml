name: 0180 golden render regression

on:
  push:
    paths:
      - "workspace/articles/f8fe59b49c2e1e/docs/99_work/e2e_pilot/0180_render_trigger.txt"

permissions:
  contents: read

jobs:
  render-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/articles/f8fe59b49c2e1e
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Render and verify golden semantics
        shell: bash
        run: |
          set -euo pipefail
          sha256sum docs/10_each_lore/0180_kisaragi_station/0180_00_sources.json docs/10_each_lore/0180_kisaragi_station/0180_10_contents.json docs/10_each_lore/0180_kisaragi_station/0180_20_analysis.json > /tmp/before.sha
          python -m src.rendering.render_00_sources 0180
          python -m src.rendering.render_10_contents 0180
          python -m src.rendering.render_20_analysis 0180
          sha256sum docs/10_each_lore/0180_kisaragi_station/0180_00_sources.json docs/10_each_lore/0180_kisaragi_station/0180_10_contents.json docs/10_each_lore/0180_kisaragi_station/0180_20_analysis.json > /tmp/after.sha
          diff -u /tmp/before.sha /tmp/after.sha

          out00=docs/99_work/rendered_10_each_lore/0180/0180_00_sources.md
          out10=docs/99_work/rendered_10_each_lore/0180/0180_10_contents.md
          out20=docs/99_work/rendered_10_each_lore/0180/0180_20_analysis.md

          grep -F "レス98から投稿者「はすみ」の最終投稿レス635まで" "$out00"
          grep -F "遠州鉄道" "$out00"
          grep -F "Geo-グラフィック" "$out00"
          grep -F "投稿停止後の帰還・所在・失踪・死亡" "$out00"
          grep -F "異界・あの世" "$out00"

          grep -F "20分以上停車" "$out10"
          grep -F "きさらぎ駅" "$out10"
          grep -F "110番" "$out10"
          grep -F "片足の老人" "$out10"
          grep -F "伊佐貫" "$out10"
          grep -F "比奈" "$out10"
          grep -F "レス635を最後に投稿が途絶え" "$out10"
          grep -F "相互に一致せず" "$out10"
          grep -F "初期ログ内では帰還・所在・身体状態・真相は確定しない" "$out10"

          grep -F "D04.COL.LIVE_COCREATION" "$out20"
          grep -F "D09.UNK.DELIBERATE_NONRESOLUTION" "$out20"
          grep -F "### D10 — U" "$out20"
          grep -F "D13.RST.SPATIAL_DISTORTION" "$out20"
          grep -F "D15.KNW.UNCERTAINTY_PRESERVED" "$out20"
          grep -F "D17.UNA.NO_KNOWN_ESCAPE" "$out20"
          grep -F "D18.L1" "$out20"
          grep -F "### D20 — U" "$out20"
          grep -F "D21.A2" "$out20"

          echo "0180_GOLDEN_RENDER=PASS"
