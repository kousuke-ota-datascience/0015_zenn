name: f8fe59b49c2e1e E2E review pilot

on:
  push:
    paths:
      - "workspace/articles/f8fe59b49c2e1e/docs/99_work/e2e_pilot/review_cycle_*_bodies.json"

permissions:
  contents: write

jobs:
  write-review:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/articles/f8fe59b49c2e1e
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Review writer dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1
      - name: Prepare and write latest E2E Review cycle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from src.reviewing.review_writer import prepare_review_cycle, write_review_cycle

          inputs = sorted(Path("docs/99_work/e2e_pilot").glob("review_cycle_*_bodies.json"))
          if not inputs:
              raise SystemExit("no E2E review body input")
          body_path = inputs[-1]
          reviews = json.loads(body_path.read_text(encoding="utf-8"))
          cycle = prepare_review_cycle("0001")
          result = write_review_cycle("0001", cycle=cycle, reviews=reviews)
          print(json.dumps({"input": str(body_path), **result}, ensure_ascii=False, indent=2))
          PY
      - name: Commit canonical Review JSON
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews/10_each_lore/0001/
          if git diff --cached --quiet; then
            echo "No Review JSON generated"
            exit 1
          fi
          seq="$(ls reviews/10_each_lore/0001/Review_0001_00_*.json | sort | tail -1 | sed -E 's/.*_([0-9]+)\.json/\1/')"
          git commit -m "Add canonical 0001 Review cycle ${seq}"
          git push
